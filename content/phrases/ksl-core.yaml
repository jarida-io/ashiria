# Everyday KSL phrases: what the course can teach and the reader can expect, in KSL word order (glosses).
#   gloss:    signs in the order they are signed; each is a KSL Dictionary sign name, or a letter for fingerspelling
#   source:   attested (the gloss appears in Kenyan teaching material, see `ref`) or patterned (built by us from the
#             attested patterns: time first, verb after its object, question word, NOTHING, MUST and FINISH last,
#             possessive after the noun). Patterned phrases need a Deaf KSL signer's check before they ship.
#   recorded: the dictionary's own video of the whole phrase, when there is one (real signing, real transitions)
#   question: signed with a question face (raised or lowered brows), which the hands alone don't show
# Sources: JOOUST and Kenyatta University KSL course materials, the Maseno AI4KSL paper (arXiv 2410.18295); see
# docs/CONTENT.md#phrases.
version: 0.1.0
