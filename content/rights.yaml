# Who allows what. `ashiria pack --release` refuses a pack whose sources lack permission here.

ksl_dictionary:
  # The KSL Dictionary videos belong to their owners. Jerry holds their permission (confirmed by Jerry on 14 Oct 2026).
  # Packs carry only hand-pose data derived from the videos: never video, images or the dictionary's text, and the
  # dictionary is credited in the write-up, not inside the app.
  permission: written     # none | written
  reference: "Held by Jerry Ochieng; confirmed by Jerry on 14 Oct 2026 (\"I have all the rights\")"
  date: 2026-10-14
  scope: "to develop the KSL translator (Jerry's KSL platform, of which Ashiria is the Quest app)"

studio:
  # Studio signers other than the developer (team members who are Entrants) sign this consent form version.
  consent_form: ""        # e.g. ashiria-studio-consent-v1
