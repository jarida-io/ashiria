[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashiria-train"
version = "0.1.0"
description = "Training pipeline for Ashiria's on-device KSL sign model"
requires-python = ">=3.10,<3.13"
# Core: enough to audit, extract landmarks and build references. Training needs the `train` extra.
dependencies = [
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.9",
  "mediapipe>=0.10.14",
  "pyyaml>=6",
  "pandas>=2.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = ["torch>=2.3", "onnx>=1.16", "onnxruntime>=1.18", "scikit-learn>=1.4"]
dev = ["pytest>=8"]

[project.scripts]
ashiria = "ashiria_train.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
